name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install autoconf automake cmake libtool m4 ninja pkg-config

      - name: Add Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Build ddnet-libs for iOS
        run: |
          chmod -R +x ./scripts/
          export M4="$(brew --prefix m4)/bin/m4"
          mkdir -p build-ios-libs
          ./scripts/compile_libs/gen_libs.sh build-ios-libs ios
          find build-ios-libs -type d -name ios -exec rm -rf {} + -prune
          cp -r build-ios-libs/ddnet-libs/. ddnet-libs/

      - name: Build BestClient for iOS
        run: |
          ./scripts/ios/cmake_ios.sh device BestClient org.bestclient.app Release build-ios-client
          echo "=== Ищем собранный .app ==="
          find build-ios-client -name "*.app" -type d

      - name: Create Steam dylib stub
        run: |
          cat > /tmp/stub.c << 'EOF'
          #include <stdint.h>
          void SteamAPI_Init() {}
          void SteamAPI_Shutdown() {}
          int SteamAPI_IsSteamRunning() { return 0; }
          void SteamAPI_RunCallbacks() {}
          int SteamAPI_GetHSteamPipe() { return 0; }
          int SteamAPI_GetHSteamUser() { return 0; }
          void SteamAPI_RegisterCallback() {}
          void SteamAPI_UnregisterCallback() {}
          void SteamAPI_RegisterCallResult() {}
          void SteamAPI_UnregisterCallResult() {}
          int SteamAPI_InitFlat() { return 0; }
          void SteamAPI_ReleaseCurrentThreadMemory() {}
          int SteamAPI_ManualDispatch_Init() { return 0; }
          void SteamAPI_ManualDispatch_RunFrame() {}
          int SteamAPI_ManualDispatch_GetNextCallback() { return 0; }
          int SteamAPI_ManualDispatch_GetNextCallResult() { return 0; }
          void SteamAPI_ManualDispatch_FreeLastCallback() {}
          void SteamAPI_ManualDispatch_FreeLastCallResult() {}
          void* SteamInternal_ContextInit() { return 0; }
          void* SteamInternal_CreateInterface() { return 0; }
          void* SteamInternal_FindOrCreateUserInterface() { return 0; }
          void* SteamInternal_FindOrCreateGameServerInterface() { return 0; }
          void* SteamInternal_GameServer_Init() { return 0; }
          void* SteamClient() { return 0; }
          void* SteamGameServer() { return 0; }
          int SteamAPI_ISteamApps_GetLaunchCommandLine() { return 0; }
          int SteamAPI_ISteamApps_GetLaunchCommandLineArgCount() { return 0; }
          const char* SteamAPI_ISteamApps_GetLaunchCommandLineArgByIndex() { return ""; }
          void* SteamAPI_ISteamApps() { return 0; }
          void* SteamAPI_ISteamUser() { return 0; }
          void* SteamAPI_ISteamFriends() { return 0; }
          void* SteamAPI_ISteamUtils() { return 0; }
          void* SteamAPI_ISteamUserStats() { return 0; }
          void* SteamAPI_ISteamMatchmaking() { return 0; }
          void* SteamAPI_ISteamNetworking() { return 0; }
          void* SteamAPI_ISteamRemoteStorage() { return 0; }
          void* SteamAPI_ISteamController() { return 0; }
          void* SteamAPI_ISteamInput() { return 0; }
          void* SteamAPI_ISteamHTMLSurface() { return 0; }
          void* SteamAPI_ISteamInventory() { return 0; }
          void* SteamAPI_ISteamTimeline() { return 0; }
          void* SteamAPI_ISteamRemotePlay() { return 0; }
          void* SteamAPI_ISteamGameServer() { return 0; }
          void* SteamAPI_ISteamHTTP() { return 0; }
          void* SteamAPI_ISteamMusic() { return 0; }
          void* SteamAPI_ISteamScreenshots() { return 0; }
          void* SteamAPI_ISteamUGC() { return 0; }
          EOF
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -o /tmp/libsteam_api.dylib /tmp/stub.c
          APP_PATH=$(find build-ios-client -name "BestClient.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "BestClient.app не найден, ищем любой .app..."
            APP_PATH=$(find build-ios-client -name "*.app" -type d | head -n 1)
          fi
          echo "Найден .app: $APP_PATH"
          mkdir -p "$APP_PATH/Frameworks"
          cp /tmp/libsteam_api.dylib "$APP_PATH/Frameworks/"
          echo "Заглушка libsteam_api.dylib положена в $APP_PATH/Frameworks/"

      - name: Package IPA with ad-hoc signing
        run: |
          APP_PATH=$(find . -name "BestClient.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "BestClient.app не найден, ищем любой .app..."
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Не найден ни один .app!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Найден: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          # Ad-hoc подпись
          codesign --force --deep --sign - "Payload/BestClient.app"
          zip -r BestClient.ipa Payload
          echo "=== Структура IPA ==="
          unzip -l BestClient.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BestClient-iOS-IPA
          path: BestClient.ipa
