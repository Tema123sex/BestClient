name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Prepare Linux
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout=10
          sudo apt-get install -y ninja-build openjdk-21-jdk openssl curl wget unzip
          pip install cmake
          which cmake
          cmake --version
          rustup default 1.92.0
          cargo install cargo-ndk --locked
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          chmod -R +x ./scripts/

      - name: Setup Android SDK manually
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34"

      - name: Install NDK and Build Tools
        run: |
          sdkmanager "ndk;29.0.14206865"
          sdkmanager "build-tools;36.1.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: false

      - name: Build Android app
        env:
          TW_KEY_NAME: /home/runner/DDNet.jks
          TW_KEY_ALIAS: DDNet-Key
        run: |
          export TW_KEY_PW="$(openssl rand -base64 32)"
          keytool -genkey -v -keystore "$TW_KEY_NAME" -keyalg RSA -keysize 2048 -validity 10000 -alias "$TW_KEY_ALIAS" -storepass "$TW_KEY_PW" -keypass "$TW_KEY_PW" -dname "CN=DDNet" -sigalg SHA256withRSA
          scripts/android/cmake_android.sh arm64 DDNet org.ddnet.client Debug build-android
          mkdir artifacts
          mv build-android/DDNet.apk artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ddnet-android
          path: artifacts
